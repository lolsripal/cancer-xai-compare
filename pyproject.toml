[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cxai"
version = "0.1.0"
description = "Comparative explainability study: which genes drive ML predictions of breast tumor vs. normal tissue?"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sripal Vajinepalli" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4",
  "xgboost>=2.0", "shap>=0.45", "matplotlib>=3.8", "seaborn>=0.13",
  "pyyaml>=6.0", "joblib>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.50"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
